name: Fork build (self-hosted Linux)

# Runs are titled with the description given when starting them, e.g.
# "UI rework: <what changed>". main and ui-rework builds are started by hand for this.
# Without a description, GitHub's default title is used (a single space means "default").
run-name: ${{ inputs.description || ' ' }}

# Builds the .ipa on the self-hosted Linux runner (desktop-matx) with scripts/build_linux.sh,
# then copies it to a USB-connected iPad's LiveContainer with scripts/deploy_usb.sh.
# Optional repo secret: CURSEFORGE_API_KEY (enables importing CurseForge .zip packs).

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'What this build contains (shown as the run title)'
        required: false
        type: string
      upload:
        description: 'Also upload the ipa to GitHub as a downloadable artifact (adds ~25 s)'
        required: false
        type: boolean
        default: false
  push:
    branches: [feature/import-modpack-file, feature/gamepad-passthrough, modpack-import]

permissions:
  contents: write

# One build at a time on the runner (they share the machine and the iPad).
concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ipa and copy to iPad
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ipa
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -o pipefail
          if ! scripts/build_linux.sh 2>&1 | tee build.log; then
            # Surface the failure as annotations (readable through the API without the raw log)
            grep -n -E "error:|Error [0-9]|error [0-9]|fatal|No such file|patch does not apply|\*\*\*" build.log | tail -40 > errors.txt || true
            echo "::error title=Build errors::$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Build log tail::$(tail -60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Report warnings in gamepad code
        if: always()
        run: |
          grep -E "warning:" build.log \
            | grep -E "Natives/(input/|LauncherPrefContCfgViewController|JavaLauncher|SurfaceViewController)" \
            | sed 's|.*/Natives/|Natives/|' | sort -u > warnings.txt || true
          while IFS= read -r line; do echo "::warning::$line"; done < warnings.txt
          echo "$(wc -l < warnings.txt) warning(s) in gamepad code"

      # Copies the ipa into LiveContainer on the iPad; skips with a warning if no iPad is plugged in.
      - name: Copy ipa to iPad (USB)
        run: |
          set +e
          scripts/deploy_usb.sh "$(ls artifacts/org.angelauramc.amethyst-*-ios.ipa | head -n 1)"
          rc=$?
          if [ "$rc" = 2 ]; then
            echo "::warning::No iPad connected; skipped USB copy. The ipa is still in the build artifacts."
            exit 0
          fi
          exit $rc

      - name: Upload ipa
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.upload) }}
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-ipa
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload dSYM
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.upload) }}
        uses: actions/upload-artifact@v4
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: ignore

      # modpack-import builds also go to a rolling pre-release, so the newest .ipa always has the same
      # direct link (installable in one tap: livecontainer://install?url=<that link, percent-encoded>)
      - name: Publish latest ipa
        if: github.ref == 'refs/heads/modpack-import'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=modpack-import-latest
          IPA="$(ls artifacts/*.ipa | head -1)"
          cp "$IPA" Amethyst-modpack-import.ipa
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          NOTES="Latest modpack-import build: ${GITHUB_SHA::7} ($(git log -1 --format=%s "$GITHUB_SHA")), run ${GITHUB_RUN_ID}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "modpack-import (latest)" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --title "modpack-import (latest)" --notes "$NOTES"
          fi
          gh release upload "$TAG" Amethyst-modpack-import.ipa --clobber
